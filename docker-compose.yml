version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: atl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atl
      POSTGRES_PASSWORD: ${ATL_DB_PASSWORD:-atl-bench-2026}
      POSTGRES_DB: atl
    volumes:
      - atl-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atl"]
      interval: 5s
      timeout: 3s
      retries: 5

  atl:
    build: .
    container_name: atl-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ATL_DATABASE_URL: postgres://atl:${ATL_DB_PASSWORD:-atl-bench-2026}@postgres:5432/atl?sslmode=disable
      ATL_OPERATOR_KEY_PATH: /keys/operator.key
      ATL_COORDINATOR_KEYS_DIR: /keys/coordinators
      ATL_PORT: "8080"
      ATL_MMD_SECONDS: "300"
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  atl-pgdata:
